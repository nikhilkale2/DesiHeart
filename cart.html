<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="images/veg-menu-5.webp"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="output.css" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Desi Hearth restaurant</title>
  </head>
  <body>
    <!-- Navbar -->
    <nav id="Home">
      <div class="max-w-full h-14 lg:px-9">
        <div class="flex justify-between items-center lg:p-3 mt-4 py-2 px-3">
          <!-- Website logo -->
          <div class="">
            <a href="index.html"
              ><img
                src="images/desiHeart-logo.png"
                alt=""
                class="lg:w-38 w-30"
                id="website-logo"
            /></a>
          </div>
          <!-- Desktop menu -->
          <div class="hidden lg:flex gap-12" id="Nav-Link">
            <a
              href="index.html"
              data-target="Home"
              class="text-[22px] font-medium hover:text-orange-500"
              >Home</a
            >
            <a
              href="#"
              data-target="About"
              class="text-[22px] font-medium hover:text-orange-500"
              >About</a
            >
            <a
              href="#"
              data-target="Menu"
              class="text-[22px] font-medium hover:text-orange-500"
              >Menu</a
            >
            <a
              href="#"
              data-target="Contact"
              class="text-[22px] font-medium hover:text-orange-500"
              >Contact</a
            >
          </div>
          <!-- Users icon -->
          <div class="hidden lg:flex gap-7" id="user-icon">
            <i
              class="fa-regular fa-circle-user text-3xl hover:text-red-500 cursor-pointer"
              id="userProfile"
            ></i>
            <a href="cart.html">
              <div class="flex justify-center items-center">
                <i
                  class="fa-solid fa-bag-shopping text-3xl hover:text-green-500 cursor-pointer"
                ></i>
                <p
                  class="bg-green-500 w-7 h-7 text-center text-[18px] text-white rounded-full relative right-4 top-2"
                >
                  0
                </p>
              </div>
            </a>
            <i
              class="fa-solid fa-toggle-off text-3xl hover:text-blue-700 cursor-pointer"
              id="themeBtn"
            ></i>
          </div>
          <!-- humburger-icon -->
          <div class="lg:hidden">
            <i
              class="fa-solid fa-bars text-3xl cursor-pointer"
              id="NavMenu"
            ></i>
          </div>
        </div>
      </div>
      <!-- Mobile view -->
      <div
        id="nav-dialogue"
        class="hidden h-100px w-full py-5 px-5 lg:hidden overflow-hidden"
      >
        <!-- Mobile menu -->
        <div class="flex flex-col gap-5">
          <a
            href="index.html"
            data-target="Home"
            class="text-[22px] font-medium hover:bg-gray-100 hover:rounded-circle rounded-5 p-2"
            >Home</a
          >
          <a
            href="#"
            data-target="About"
            class="text-[22px] font-medium hover:bg-gray-100 p-2"
            >About</a
          >
          <a
            href="#"
            data-target="Menu"
            class="text-[22px] font-medium hover:bg-gray-100 p-2"
            >Menu</a
          >
          <a
            href="#"
            data-target="Contact"
            class="text-[22px] font-medium hover:bg-gray-100 p-2"
            >Contact</a
          >
        </div>
        <!-- Users icon -->
        <div class="flex gap-4 mt-5">
          <i
            class="fa-regular fa-circle-user text-3xl hover:text-red-500 cursor-pointer"
          ></i>
          <div class="flex justify-center items-center">
            <i
              class="fa-solid fa-bag-shopping text-3xl hover:text-green-500 cursor-pointer"
            ></i>
            <p
              class="bg-green-500 w-7 h-7 text-center text-[18px] text-white rounded-full relative right-4 top-2"
            >
              0
            </p>
          </div>
          <i
            class="fa-solid fa-toggle-off text-3xl hover:text-blue-700 cursor-pointer"
          ></i>
        </div>
      </div>
    </nav>

    <div
      class="w-full min-h-screen p-5 mt-15 flex flex-col gap-5"
      id="FoodContainer"
    ></div>

    <!-- Scroller button -->
    <div class="hidden" id="scrollBox">
      <i
        class="fa-solid fa-circle-chevron-up text-[2.5rem] fixed lg:right-4 right-1 z-40 bottom-10 cursor-pointer"
        id="scrollBtn"
      ></i>
    </div>

    <!-- Footer section -->
    <footer>
      <div class="w-full bg-sky-300 lg:p-4 md:p-3.5 p-2.5 text-black">
        <div class="lg:flex md:flex justify-between">
          <div class="">
            <img
              src="images/desiHeart-logo.png"
              alt="desiHeart logo website"
              class="lg:w-40 md:w-40 w-30"
            />
            <p class="lg:max-w-127 md:max-w-100 text-[17px]">
              DesiHeart Serving fresh, flavorful vegetarian dishes made with
              love. Enjoy wholesome meals, delightful desserts, and a welcoming
              dining experience every time.
            </p>
          </div>
          <div class="flex justify-center items-center gap-6 mt-3">
            <a href="#" class="text-[20px] hover:text-blue-600">Home</a>
            <a href="#" class="text-[20px] hover:text-blue-600">About</a>
            <a href="#" class="text-[20px] hover:text-blue-600">Menu</a>
            <a href="#" class="text-[20px] hover:text-blue-600">Contact</a>
          </div>
        </div>
        <div class="lg:flex flex justify-center items-center flex-col mt-6">
          <h1 class="text-2xl font-bold">Subsribe our NewsLetter</h1>
          <div class="mt-3">
            <input
              type="email"
              placeholder="Enter your email"
              class="border py-1.5 px-4 rounded-2xl"
            />
            <button
              class="border-0 rounded-2xl py-1.5 bg-white px-7 text-[18px]"
            >
              Submit
            </button>
          </div>
          <p class="mt-4 text-[23px]">©2026 by Kale Nikhil</p>
        </div>
      </div>
    </footer>
    <!-- GSAP CDN -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"
      integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <!-- ScrollTrigger CDN -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"
      integrity="sha512-P2IDYZfqSwjcSjX0BKeNhwRUH8zRPGlgcWl5n6gBLzdi4Y5/0O4zaXrtO4K9TZK6Hn1BenYpKowuCavNandERg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <!-- Lenis CDN -->
    <script src="https://unpkg.com/lenis@1.3.17/dist/lenis.min.js"></script>
    <script src="script.js" defer></script>
    <script src="cart.js"></script>
  </body>
</html>
